<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملصقات مواقع المستجيب</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a toolbar over a grid of sign cards; in print, each card is a cut-out sign. */
:root{
  --navy:#1B2B4B; --orange:#F28C28; --bg:#F3F5F9; --card:#FFFFFF; --ink:#14213D; --muted:#5A667D; --line:#D7DEEA;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(20px,env(safe-area-inset-top,0px)) 40px}
.bar{max-width:1100px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bar h1{margin:0;flex:1 1 260px;font-family:var(--f-display);font-size:26px;color:var(--navy);text-wrap:balance}
.bar p{flex-basis:100%;margin:0;color:var(--muted);max-width:65ch;line-height:1.7}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button,.print{font-family:var(--f-display);font-size:15px;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:0;cursor:pointer;background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.print{background:var(--orange);color:#fff}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.sign{background:var(--card);border:2px solid var(--navy);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;break-inside:avoid}
.sign .top{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:15px}
.sign .top i{width:22px;height:22px;border-radius:6px;background:var(--orange);display:inline-block}
.qr{width:100%;max-width:200px;aspect-ratio:1}
.qr svg{width:100%;height:100%;display:block}
.sign b{font-family:var(--f-display);font-size:22px;line-height:1.3;color:var(--ink)}
.sign .en{direction:ltr;color:var(--muted);font-size:14px}
.sign small{color:var(--muted);font-size:13px;line-height:1.5}
.err{max-width:1100px;margin:0 auto;padding:16px;border-radius:14px;background:#FFF1E3;color:#7A3D06}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .grid{grid-template-columns:repeat(3,1fr);gap:10mm}
  .sign{border-width:1.5pt}
}
</style>
</head>
<body>
<div class="bar">
  <h1>ملصقات مواقع المستجيب</h1>
  <div class="seg" role="group" aria-label="المكان">
    <button data-site="mak" aria-pressed="true">المسجد الحرام</button>
    <button data-site="mad" aria-pressed="false">المسجد النبوي</button>
  </div>
  <button class="print" id="print">طباعة</button>
  <p>اطبع الملصقات وعلّقها عند الأبواب والأعمدة. يفتح الزائر الإرشاد بالكاميرا ويوجّهها على أقرب ملصق، فيعرف المستجيب مكانه بالضبط ويبدأ توجيهه منه، حتى بدون إنترنت.</p>
</div>
<div class="grid" id="grid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const SITES={mak:'المسجد الحرام',mad:'المسجد النبوي'};
const SPOTS=[
 ['mak','g_aziz','باب الملك عبدالعزيز','King Abdulaziz Gate'],['mak','g_fahd','باب الملك فهد','King Fahd Gate'],['mak','g_abdullah','باب الملك عبدالله','King Abdullah Gate'],
 ['mak','g_salam','باب السلام','Bab Al-Salam'],['mak','g_umrah','باب العمرة','Umrah Gate'],['mak','mataf','المطاف','Mataf'],['mak','masa','المسعى','Mas\'a (Safa and Marwa)'],
 ['mad','g_salam','باب السلام','Bab Al-Salam'],['mad','g_jibril','باب جبريل','Bab Jibril'],['mad','g_fahd','باب الملك فهد','King Fahd Gate'],['mad','g_baqi','باب البقيع','Bab Al-Baqi\''],['mad','rawdah','الروضة الشريفة','Al-Rawdah'],
 ['*','zamzam','ماء زمزم','Zamzam water'],['*','wc','دورات المياه','Toilets'],['*','wudu','أماكن الوضوء','Ablution area'],['*','women','مصلى النساء','Women\'s prayer area'],
 ['*','clinic','الإسعاف والعيادة','First aid and clinic'],['*','lostkid','الأطفال التائهون','Lost children'],['*','lost','المفقودات','Lost and found'],
 ['*','wheel','العربات والكراسي المتحركة','Wheelchairs and carts'],['*','lift','المصاعد والسلالم الكهربائية','Elevators and escalators'],['*','bus','الحافلات والنقل','Buses and transport'],
 ['*','info','الإرشاد والاستعلامات','Information desk'],['*','exit','أقرب مخرج','Nearest exit']];
let site='mak';
try{const s=localStorage.getItem('mstj-site');if(s&&SITES[s])site=s}catch(e){}
function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}
function draw(){
  document.querySelectorAll('[data-site]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.site===site));
  const g=document.getElementById('grid');
  if(typeof qrcode!=='function'){g.innerHTML='<div class="err">تعذّر تحميل مولّد الرموز. افتح الصفحة مرة وأنت متصل بالإنترنت، وبعدها تعمل بدونه.</div>';return}
  g.innerHTML=SPOTS.filter(s=>s[0]===site||s[0]==='*').map(([,id,ar,en])=>`<div class="sign"><div class="top"><i></i>المستجيب · ${SITES[site]}</div><div class="qr">${qrSvg('MSTJ|'+site+'|'+id)}</div><b>${ar}</b><span class="en">${en}</span><small>أنت هنا. امسح الرمز من الإرشاد بالكاميرا في المستجيب</small></div>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-site]');if(b){site=b.dataset.site;try{localStorage.setItem('mstj-site',site)}catch(_){}draw()}});
document.getElementById('print').addEventListener('click',()=>window.print());
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
